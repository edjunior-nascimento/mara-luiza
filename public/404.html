<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Pega o caminho original
      var pathname = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Redireciona para o domínio correto, preservando rota
      var redirectUrl = window.location.protocol + "//" + window.location.host + pathname + search + hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
