<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redireciona para index.html mantendo a rota original
      var redirectUrl = window.location.protocol + "//" + window.location.host + "/index.html" + window.location.pathname + window.location.search;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    Redirecionando...
  </body>
</html>
